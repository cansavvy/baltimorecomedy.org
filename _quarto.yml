project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!FORM-SPEC.md"
  resources:
    - CNAME

website:
  title: ""
  google-analytics: "G-462HTM8M2V"
  site-url: "https://baltimorecomedy.org"
  description: "Baltimore's finest (and most questionable) comedic talent, all in one place."
  navbar:
    background: "#05070d"
    foreground: "#e8dcc3"
    logo: images/logo-mark.svg
    title: "BALTIMORE COMEDY"
    left:
      - href: index.qmd
        text: Home
      - href: shows.qmd
        text: Shows
      - href: comedians.qmd
        text: Find Comedians
      - href: open-mics.qmd
