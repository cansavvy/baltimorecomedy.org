      - href: submit.qmd
        text: Get Listed
  page-footer:
    background: "#05070d"
    foreground: "#5b7fa6"
    left: "© 2026 Baltimore Comedy.org"
    right: "Baltimore, MD"

format:
  html:
    theme: [darkly, styles.scss]
    css: styles.css
    toc: false
    grid:
      body-width: 1000px
    fontsize: 1.05rem
    linkcolor: "#6fb7ff"
